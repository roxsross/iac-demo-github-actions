name: Kiro Documentation Generator

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Generate documentation
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_LOG_NO_COLOR: "1"
        run: |
          kiro-cli chat \
            --no-interactive \
            --agent doc-generator \
            --trust-all-tools \
            "Escanea este repositorio y actualiza la documentación.

            Revisa la estructura completa del proyecto, el código fuente, los archivos de configuración y cualquier componente relevante para entender su funcionamiento actual.

            Tareas principales:
            - Si existe el directorio docs/, actualiza los archivos correspondientes allí.
            - Si existe un archivo README.md, actualízalo para reflejar:
              - Nuevas APIs públicas
              - Interfaces modificadas
              - Cambios relevantes en la forma de usar el proyecto
              - Nuevos comandos, configuraciones o dependencias importantes
            - Crea documentación para cualquier módulo público, servicio, función o componente que aún no esté documentado.
            - Si detectas documentación desactualizada, corrígela para que coincida con el estado real del código.
            - Mantén la documentación clara, ordenada y orientada a desarrolladores.

            Requisitos:
            - No elimines información útil sin reemplazarla por una versión mejorada.
            - Conserva el estilo general de la documentación existente cuando sea posible.
            - Prioriza explicaciones precisas, ejemplos de uso y pasos reproducibles.
            - La documentación final debe ayudar a entender, usar, mantener y extender este repositorio."

      - name: Push documentation updates
        run: |
          if git diff --quiet; then
            echo "No documentation changes detected."
            exit 0
          fi

          BRANCH="docs/auto-update-$(date +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A

          git commit -m "docs: actualización automática de documentación vía Kiro

          Generado por el agente doc-generator de Kiro.
          Ejecutado tras un push a main."

          git push -u origin "$BRANCH"

          echo "📚 Actualizaciones de documentación enviadas a la rama: $BRANCH"